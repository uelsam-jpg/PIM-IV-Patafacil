# ============================================================
# nginx — Frontend PataFácil
# Serve os arquivos estáticos e (opcional) faz proxy da API.
# ============================================================
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;

    # Headers de segurança
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Cache curto para os arquivos estáticos
    location / {
        try_files $uri $uri/ =404;
    }

    # Opcional: se o frontend usar caminho relativo /api, descomente o proxy abaixo
    # location /api/ {
    #     proxy_pass http://api:80/api/;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    # }
}
