<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PataFácil - Pet Shop & Serviços</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="has-sidebar">

    <!-- MENU LATERAL DE NAVEGAÇÃO -->
    <aside class="sidebar">
        <div class="sidebar-brand">PataFácil</div>
        
        <p class="sidebar-title">Bem-vindo(a)</p>
        <ul class="sidebar-menu">
            <li><a href="index.html" class="active">Tela de Login</a></li>
        </ul>

    </aside>

    <div class="container">
        <div class="form-box">
            <div class="logo">
                <h2>PataFácil</h2>
                <p>O melhor cuidado para o seu melhor amigo.</p>
            </div>

            <div class="button-box">
                <div id="btn-background"></div>
                <button type="button" class="toggle-btn ativo" onclick="mostrarLogin()">Login</button>
                <button type="button" class="toggle-btn" onclick="mostrarCadastro()">Cadastro</button>
            </div>

            <!-- Formulário de Login -->
            <form id="login-form" class="input-group">
                <input type="email" id="log-email" class="input-field" placeholder="E-mail" aria-label="E-mail" autocomplete="username" required>
                <input type="password" id="log-senha" class="input-field" placeholder="Senha" aria-label="Senha" autocomplete="current-password" required>
                <button type="submit" class="submit-btn" onclick="realizarLogin(event)">Entrar</button>
            </form>

            <!-- Formulário de Cadastro (Tutor) -->
            <form id="cadastro-form" class="input-group">
                <input type="text" id="cad-nome" class="input-field" placeholder="Nome Completo" aria-label="Nome completo" required>
                <input type="text" id="cad-cpf" class="input-field" placeholder="CPF" aria-label="CPF" inputmode="numeric" maxlength="14" required>
                <input type="email" id="cad-email" class="input-field" placeholder="E-mail" aria-label="E-mail" autocomplete="email" required>
                <input type="tel" id="cad-telefone" class="input-field" placeholder="Telefone / WhatsApp com DDD" aria-label="Telefone com DDD" inputmode="tel" maxlength="15" autocomplete="tel" required>
                <input type="password" id="cad-senha" class="input-field" placeholder="Crie uma Senha (mín. 6 caracteres)" aria-label="Crie uma senha" minlength="6" autocomplete="new-password" required>
                <button type="submit" class="submit-btn" onclick="cadastrarTutor(event)">Cadastrar</button>
            </form>
        </div>
    </div>

    <!-- Plugin VLibras (Requisito de Acessibilidade RNF06 - PIM III) -->
    <div vw class="enabled">
        <div vw-access-button class="active"></div>
        <div vw-plugin-wrapper><div class="vw-plugin-top-wrapper"></div></div>
    </div>
    <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
    <script>new window.VLibras.Widget('https://vlibras.gov.br/app');</script>

    <script src="app.js"></script>
    <script src="ui.js"></script>
</body>
</html>
